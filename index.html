<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YO-YO Twin Maze</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-wrap">
    <header>
      <h1>YO-YO Twin Maze</h1>
      <p>Player 1: W A S D | Player 2: Arrow Keys | R: Restart</p>
    </header>

    <canvas id="gameCanvas" width="800" height="520" aria-label="YO-YO Twin Maze game canvas"></canvas>

    <section class="status">
      <p>Black ball goes to the black finish. White ball goes to the white finish.</p>
      <p id="message">Both players must be inside their finish zones at the same time.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
