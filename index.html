<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YO-YO CONVERGENCE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <h1>YO-YO CONVERGENCE</h1>
      <p>
        Black: WASD &nbsp;|&nbsp; White: Arrow Keys &nbsp;|&nbsp; R: Restart
      </p>
    </header>

    <canvas id="gameCanvas" aria-label="YO-YO CONVERGENCE cooperative canvas game"></canvas>

    <p class="hint">
      Reach the glowing center together. Avoid moving dots with both balls and the string.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
