<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHOENIX Yo-Yo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app" aria-label="PHOENIX two-player yo-yo game">
    <header class="hud" aria-live="polite">
      <div class="hud__pill" id="timer">TIME: 60</div>
      <div class="hud__progress" id="progress" aria-label="Word progress">_ _ _ _ _ _ _</div>
    </header>

    <canvas id="gameCanvas" aria-label="Game canvas"></canvas>

    <aside class="controls" aria-label="Controls">
      <p><span>P1 Reveal</span> A / D move &middot; W shoot down</p>
      <p><span>P2 Collect</span> Left / Right move &middot; Up shoot up</p>
    </aside>

    <section class="overlay overlay--visible" id="startScreen" aria-labelledby="startTitle">
      <article class="modal">
        <p class="modal__eyebrow">Co-op timing game</p>
        <h1 id="startTitle">PHOENIX<br>YO-YO</h1>
        <p>Reveal glowing stream dots, collect only flipped letters in order, and complete PHOENIX before the timer ends.</p>
        <button id="startButton" type="button">Begin</button>
      </article>
    </section>

    <section class="overlay" id="endScreen" aria-live="assertive" aria-labelledby="resultTitle">
      <article class="modal modal--result" id="resultCard">
        <p class="modal__eyebrow" id="resultEyebrow">Result</p>
        <h2 id="resultTitle">PHOENIX COMPLETE!</h2>
        <p id="resultText">The firebird rises.</p>
        <button id="restartButton" type="button">Play Again</button>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
