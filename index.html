<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YO-YO TENSION FIELD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div>
        <h1>YO-YO TENSION FIELD</h1>
        <p>Reach both green finish zones together. Press <strong>R</strong> to restart.</p>
      </div>
      <div class="controls">
        <span><strong>Black:</strong> WASD</span>
        <span><strong>White:</strong> Arrow Keys</span>
      </div>
    </header>

    <canvas id="gameCanvas" width="960" height="600" aria-label="YO-YO TENSION FIELD game canvas"></canvas>
  </main>

  <script src="script.js"></script>
</body>
</html>
