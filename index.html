<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoyo</title>
  <style>
    :root {
      --bg-top: #1b1035;
      --bg-bottom: #34146b;
      --accent: #ff5d8f;
      --accent-2: #ffd166;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #fff;
      background: radial-gradient(circle at 50% 0%, var(--bg-bottom), var(--bg-top));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
    }

    h1 {
      margin: 28px 0 4px;
      font-size: 2.4rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
    }

    p.subtitle {
      margin: 0 0 8px;
      opacity: 0.75;
      font-size: 0.95rem;
    }

    /* Stage that holds the string + yoyo. The whole rig drops on a throw. */
    .stage {
      position: relative;
      width: 220px;
      height: 420px;
      display: flex;
      justify-content: center;
    }

    .string {
      position: absolute;
      top: 0;
      width: 3px;
      height: 120px;
      background: linear-gradient(#fef9e7, #c9b896);
      transform-origin: top center;
      transition: height 0.45s cubic-bezier(0.45, 0, 0.55, 1);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
    }

    .yoyo {
      position: absolute;
      top: 120px;
      width: 150px;
      height: 150px;
      transition: top 0.45s cubic-bezier(0.45, 0, 0.55, 1);
      animation: spin 1.6s linear infinite;
      filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.45));
    }

    /* When "thrown", the yoyo drops down the (lengthened) string and spins fast. */
    .stage.thrown .string { height: 300px; }
    .stage.thrown .yoyo {
      top: 300px;
      animation-duration: 0.25s;
    }

    .yoyo-face {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        repeating-conic-gradient(
          from 0deg,
          var(--accent) 0deg 30deg,
          #ffffff 30deg 60deg
        );
      border: 8px solid #2a1b4d;
      position: relative;
      box-shadow:
        inset 0 0 0 6px var(--accent-2),
        inset 0 0 40px rgba(0, 0, 0, 0.35);
    }

    .yoyo-face::after {
      content: "";
      position: absolute;
      inset: 38%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff, #b8b8c8 70%, #6f6f85);
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.4);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .controls {
      margin-top: 6px;
      display: flex;
      gap: 14px;
    }

    button {
      font: inherit;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 12px 26px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      color: #2a1b4d;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 12px 22px rgba(0, 0, 0, 0.45); }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <h1>Yoyo</h1>
  <p class="subtitle">It spins on its own &mdash; click <strong>Throw!</strong> to send it down the string.</p>

  <div class="stage" id="stage">
    <div class="string"></div>
    <div class="yoyo" id="yoyo" title="Click me!">
      <div class="yoyo-face"></div>
    </div>
  </div>

  <div class="controls">
    <button id="throwBtn">Throw!</button>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const yoyo = document.getElementById("yoyo");
    const throwBtn = document.getElementById("throwBtn");

    let busy = false;

    // Throw the yoyo: drop it down, let it "sleep" (spin fast) at the bottom,
    // then reel it back up.
    function doThrow() {
      if (busy) return;
      busy = true;
      stage.classList.add("thrown");
      window.setTimeout(() => {
        stage.classList.remove("thrown");
        window.setTimeout(() => { busy = false; }, 500);
      }, 1200);
    }

    throwBtn.addEventListener("click", doThrow);
    yoyo.addEventListener("click", doThrow);
  </script>
</body>
</html>
